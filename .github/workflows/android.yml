name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # Retained signing is restricted to main, never PR or feature-branch code.
    env:
      AURA_SIGNING_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.AURA_SIGNING_KEYSTORE_BASE64 || '' }}
      AURA_SIGNING_STORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.AURA_SIGNING_STORE_PASSWORD || '' }}
      AURA_SIGNING_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.AURA_SIGNING_KEY_ALIAS || '' }}
      AURA_SIGNING_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.AURA_SIGNING_KEY_PASSWORD || '' }}
      AURA_SIGNING_CERT_SHA256: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AURA_SIGNING_CERT_SHA256 || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_model.py
      - run: pip install -r tools/requirements-model.txt
      - run: python tools/model_smoke.py --report model-smoke-report.json
      - name: Prepare optional retained signing
        run: python tools/android_signing.py prepare
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
        working-directory: android
      - name: Verify APK signature and publish certificate metadata
        run: >-
          python tools/android_signing.py report
          --apk android/app/build/outputs/apk/debug/app-debug.apk
          --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          --output android/app/build/outputs/apk/debug/signing-report.json
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aura-signing.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-v0.3-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/signing-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
            model-smoke-report.json
  inference-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-inference-integration-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
